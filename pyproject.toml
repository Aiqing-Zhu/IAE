[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iae"
version = "1.0.0"
description = "Interface Autoencoder: spectral encode/decode of an interface and a function on it, with MIONet operator learning"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Aiqing Zhu" },
    { name = "Pengzhan Jin" },
]
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "torch>=2.2",
    "matplotlib>=3.7",
    "contourpy>=1.2",
]

[project.optional-dependencies]
# GINO baseline only (baselines/gino/); not needed by the IAE code.
gino = ["neuraloperator==2.0.0"]

[tool.setuptools.packages.find]
include = ["iae*"]
