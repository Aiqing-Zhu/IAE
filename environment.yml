# Conda environment for the Interface Autoencoder code.
#
#   conda env create -f environment.yml
#   conda activate iae
#
# These are the versions everything in this repository was run and verified with.
# The code is not pinned to them -- requirements.txt gives the looser bounds that
# should also work -- but this combination is the one that produced the reported
# numbers.
#
# The GINO baseline in baselines/gino/ needs `neuraloperator==2.0.0` on top of this
# and is not required for anything else; see baselines/gino/README.md.
name: iae
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.12
  - numpy=2.5
  - scipy=1.18
  - matplotlib=3.11
  - contourpy=1.3
  - pip
  - pip:
      # CUDA 12.4 build; use the cpu index-url instead if you have no GPU.
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.6.0
